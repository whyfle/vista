[package]
name = "vista"
version = "0.1.0"
edition = "2021"
description = "Vista — A GitHub-backed universal Linux package manager"
authors = ["Vista Contributors"]
license = "MIT"
repository = "https://github.com/whyfle/vista"
keywords = ["package-manager", "linux", "github", "flatpak"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = { version = "2.10", features = ["json"] }
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
colored = "2.2"
anyhow = "1.0"
thiserror = "2.0"
regex = "1.11"
semver = "1.0"
wildmatch = "2.4"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
