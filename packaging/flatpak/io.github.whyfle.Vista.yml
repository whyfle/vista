app-id: io.github.whyfle.Vista
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: vista
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.PackageKit
modules:
  - name: vista
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked || cargo build --release --locked
      - install -Dm0755 target/release/vista /app/bin/vista
    sources:
      - type: dir
        path: ../..
        # For Flathub submission, replace with:
        # type: git
        # url: https://github.com/whyfle/vista.git
        # tag: v0.1.0
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/vista/cargo
